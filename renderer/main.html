<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>WHENNOTE</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; overflow: hidden; background: var(--bg-app); }
  body { user-select: none; }
  /* display:flex 같은 저자 규칙이 UA의 [hidden]을 이긴다 — 안내와 편집 영역이 함께 그려지던 원인 */
  [hidden] { display: none !important; }
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* ── 검색창 = 입력창 (MAIN-01) */
  .searchbar { flex: none; padding: var(--sp-4) var(--sp-5) 0; }
  .search {
    display: flex; align-items: center; gap: var(--sp-3);
    height: 52px; padding: 0 16px; border-radius: var(--r-md);
    background: var(--bg-raised); border: 1.5px solid var(--border);
    transition: border-color .12s, box-shadow .12s;
  }
  .search:focus-within { border-color: var(--border-focus); box-shadow: 0 0 0 4px var(--accent-dim); }
  .search .ico { color: var(--accent); opacity: 1; }
  .search input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text-primary); font-family: var(--font-sans); font-size: 18px; font-weight: 500;
    user-select: text;
  }
  .search input::placeholder { color: var(--text-muted); font-weight: 400; }
  .search .hint { display: flex; gap: var(--sp-2); color: var(--text-muted); font-size: var(--fs-xs); white-space: nowrap; }

  /* ── 태그 칩 줄 */
  .tagsbar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px var(--sp-5) 0; min-height: 22px; }
  .tagsbar .chip { cursor: pointer; }
  .tagsbar .chip:hover { border-color: var(--text-muted); color: var(--text-primary); }
  .tagsbar .chip.on { background: var(--accent-dim); border-color: transparent; color: var(--accent); }

  /* ── 본문: 결과 목록 | 편집 */
  .body { flex: 1; display: flex; gap: var(--sp-4); padding: var(--sp-3) var(--sp-5) var(--sp-4); min-height: 0; }
  .left { width: 400px; flex: none; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .create {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r-sm);
    background: var(--accent-dim); color: var(--accent); border: 1px dashed rgba(122,162,247,.45);
    font-size: var(--fs-sm); cursor: pointer;
  }
  .create[hidden] { display: none; }
  .create .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .listmeta { display: flex; justify-content: space-between; padding: 6px 6px 2px; color: var(--text-muted); font-size: var(--fs-xs); }
  #list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
  .row {
    display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border-radius: var(--r-sm);
    background: var(--bg-raised); border: 1px solid var(--border); cursor: pointer;
  }
  .row:hover { background: var(--bg-hover); }
  .row.sel { border-color: var(--border-focus); }
  .row .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row .title { font-weight: 600; font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .row .title .ico { color: var(--accent); opacity: 1; }
  .row .when { flex: none; color: var(--text-muted); font-size: var(--fs-xs); }
  .row .snip { color: var(--text-secondary); font-size: var(--fs-xs); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .row .tags .chip { color: var(--accent); background: var(--accent-dim); border-color: transparent; }
  mark { background: rgba(122,162,247,.28); color: var(--text-primary); border-radius: 2px; padding: 0 1px; }
  .empty { color: var(--text-muted); font-size: var(--fs-sm); padding: 24px 8px; text-align: center; line-height: 1.7; }

  .right { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: var(--r-md); background: var(--bg-raised); border: 1px solid var(--border); overflow: hidden; }
  .right[hidden] { display: none; }
  .placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-muted); font-size: var(--fs-sm); line-height: 1.8; text-align: center; }
  .placeholder kbd { margin: 0 2px; }
  .editor { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .toolbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .toolbar .spacer { flex: 1; }
  .toolbar button, .undo button {
    height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid transparent; background: none;
    color: var(--text-secondary); font: inherit; font-size: var(--fs-xs); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .toolbar button:hover { background: var(--bg-hover); color: var(--text-primary); }
  .toolbar button.on { background: var(--accent-dim); color: var(--accent); }
  .toolbar .saved { color: var(--text-muted); font-size: var(--fs-xs); margin-right: 4px; }
  .toolbar .saved.dirty { color: var(--warning); }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: none;
    color: var(--text-primary); font-family: var(--font-sans); font-size: 15px; line-height: 1.75;
    padding: 20px 28px; user-select: text;
  }
  textarea[hidden] { display: none; }
  .preview { flex: 1; overflow-y: auto; padding: 20px 28px; font-size: 15px; line-height: 1.75; color: var(--text-primary); user-select: text; }
  .preview[hidden] { display: none; }
  .preview h2, .preview h3, .preview h4, .preview h5 { margin: 0 0 10px; line-height: 1.35; }
  .preview h2 { font-size: 22px; } .preview h3 { font-size: 18px; } .preview h4 { font-size: 16px; }
  .preview p { margin: 0 0 12px; }
  .preview ul, .preview ol { margin: 0 0 12px; padding-left: 22px; }
  .preview blockquote { margin: 0 0 12px; padding: 4px 14px; border-left: 3px solid var(--border); color: var(--text-secondary); }
  .preview code { font-family: var(--font-mono); font-size: 13px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .preview pre { margin: 0 0 12px; padding: 12px 14px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--r-sm); overflow-x: auto; }
  .preview pre code { border: none; padding: 0; background: none; }
  .preview a.wikilink { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(122,162,247,.4); cursor: pointer; }
  .preview a.wikilink.missing { color: var(--text-muted); border-bottom-style: dashed; }
  .preview a.tag { color: var(--accent); cursor: pointer; text-decoration: none; }
  .meta { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: var(--fs-xs); }
  .meta .dot { width: 3px; height: 3px; border-radius: 99px; background: var(--text-muted); }
  .meta .backlink { color: var(--accent); cursor: pointer; }

  /* ── 하단 안내 */
  .foot { flex: none; display: flex; align-items: center; gap: 18px; padding: 0 var(--sp-5) 10px; color: var(--text-muted); font-size: var(--fs-xs); }
  .foot span { display: inline-flex; align-items: center; gap: 6px; }
  .foot .spacer { flex: 1; }
  .notice { color: var(--warning); }

  /* ── 되돌리기 토스트 */
  .undo {
    position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: var(--r-md);
    background: var(--bg-inset); border: 1px solid var(--border); box-shadow: var(--shadow-pop);
    font-size: var(--fs-sm); color: var(--text-primary);
  }
  .undo[hidden] { display: none; }
  .undo button { color: var(--accent); }
  .undo button:hover { background: var(--bg-hover); }
</style>
</head>
<body>
  <div class="app">
    <div class="searchbar">
      <div class="search" id="search">
        <span id="searchIco"></span>
        <input id="q" type="text" placeholder="검색하거나 그대로 새 메모로" autocomplete="off" spellcheck="false">
        <span class="hint"><kbd>Shift ↵</kbd> 새 메모</span>
      </div>
    </div>
    <div class="tagsbar" id="tags"></div>
    <div class="body">
      <div class="left">
        <div class="create" id="create" hidden>
          <span id="createIco"></span><span class="label" id="createLabel"></span><kbd>Shift ↵</kbd>
        </div>
        <div class="listmeta"><span id="count"></span><span id="order">최근 열어본 순</span></div>
        <div id="list"></div>
      </div>
      <div class="right" id="right">
        <div class="placeholder" id="placeholder">
          <div>메모를 고르거나, 위에 적고 <kbd>Shift ↵</kbd></div>
          <div id="hotkeyHint"></div>
        </div>
        <div class="editor" id="editor" hidden>
          <div class="toolbar">
            <span class="spacer"></span>
            <span class="saved" id="saved"></span>
            <button id="togglePreview" title="보기 / 편집 (Ctrl+E)"></button>
            <button id="pin" title="고정"></button>
            <button id="archive" title="아카이브"></button>
            <button id="remove" title="삭제"></button>
          </div>
          <textarea id="body" spellcheck="false"></textarea>
          <div class="preview" id="preview" hidden></div>
          <div class="meta" id="meta"></div>
        </div>
      </div>
    </div>
    <div class="foot">
      <span><kbd>↑↓</kbd> 이동</span>
      <span><kbd>↵</kbd> 열기</span>
      <span><kbd>Esc</kbd> 검색으로 · 닫기</span>
      <span><kbd>Ctrl E</kbd> 보기</span>
      <span class="spacer"></span>
      <span class="notice" id="notice"></span>
      <span id="footHotkey"></span>
    </div>
    <div class="undo" id="undo" hidden><span id="undoText"></span><button id="undoBtn">되돌리기</button></div>
  </div>
<script src="icons.js"></script>
<script src="view.js"></script>
<script src="md.js"></script>
<script src="main.js"></script>
</body>
</html>
