<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; }
    a { color: #e0a93a; } a:hover { color: #f2c05a; }
  </style>
</helmet>
<div style="width: 560px; height: 640px; background: #dcdfe4; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-sizing: border-box;">

  <div style="position: absolute; left: 0; top: 0; right: 0; height: 640px; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.35) 0 1px, transparent 1px 28px), repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 1px, transparent 1px 28px);"></div>

  <div style="position: relative; width: 380px; background: #1d1f24; color: #ebe8e1; border-radius: 14px; box-shadow: 0 24px 60px rgba(20,22,28,0.35), 0 2px 6px rgba(20,22,28,0.25); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #2c2f37; box-sizing: border-box;">

    <div style="height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px; border-bottom: 1px solid #2c2f37;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5c616d" stroke-width="1.5" stroke-linecap="round"><path d="M2 4.5h10M2 7h10M2 9.5h10"></path></svg>
        <span style="font-size: 12px; color: #9096a3;">퀵 메모</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; background: #2b2417; color: #e0a93a; font-size: 11.5px; font-weight: 500;">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#e0a93a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 1.5l3 3-2 1-2 3-1 1L2 6l1-1 3-2z"></path><path d="M4 8l-2.5 2.5"></path></svg>
          <span>항상 위</span>
        </span>
        <span style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 7px;">
          <svg width="12" height="12" viewBox="0 0 12 12" stroke="#6b7080" stroke-width="1.4" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"></path></svg>
        </span>
      </div>
    </div>

    <div style="padding: 18px 18px 6px; display: flex; flex-direction: column; gap: 10px; min-height: 250px;">
      <div style="font-size: 16px; line-height: 1.65; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-weight: 500;">캐시 무효화가 느린 이유</div>
        <p style="margin: 0; color: #d6d2c9;">CDN 퍼지가 리전별로 순차 전파돼서 최대 10분. 앱에서 버전 쿼리스트링을 붙이는 쪽이 근본 해결. PR 42에 관련 논의 있음.</p>
        <div style="display: flex; align-items: center;">
          <span style="color: #d6d2c9;">인프라팀 의견 들어보기</span>
          <span style="display: inline-block; width: 2px; height: 20px; background: #e0a93a; margin-left: 2px;"></span>
        </div>
      </div>
    </div>

    <div style="padding: 6px 18px 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; background: #23262d; border: 1px solid #30343d;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#9096a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="8" height="11" rx="1.5"></rect><path d="M6 3V2h4v1"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 11px; color: #9096a3;">클립보드에 링크가 있어요</span>
          <span style="font-size: 12px; color: #c9c5bb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">github.com/when630/whennote/pull/42</span>
        </div>
        <span style="font-size: 11px; color: #e0a93a; border: 1px solid #4a3d1f; border-radius: 5px; padding: 2px 7px; flex-shrink: 0;">Ctrl V</span>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; color: #6b7080;">태그 제안</span>
        <span style="font-size: 11.5px; color: #e0a93a; background: #2b2417; border-radius: 5px; padding: 3px 8px;">#배포</span>
        <span style="font-size: 11.5px; color: #9096a3; background: #23262d; border-radius: 5px; padding: 3px 8px;">#인프라</span>
      </div>
    </div>

    <div style="height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-top: 1px solid #2c2f37; background: #191b1f; font-size: 11px; color: #6b7080;">
      <span style="display: flex; align-items: center; gap: 6px;"><span style="border: 1px solid #3a3e48; border-radius: 4px; padding: 1px 5px; color: #9096a3;">Esc</span>저장하고 닫기</span>
      <span style="display: flex; align-items: center; gap: 6px;"><span style="border: 1px solid #3a3e48; border-radius: 4px; padding: 1px 5px; color: #9096a3;">Ctrl ↵</span>메인 창에서 열기</span>
      <span style="display: flex; align-items: center; gap: 5px; color: #7fa36a;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #7fa36a;"></span>저장됨</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
